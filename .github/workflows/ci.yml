# The checks of CONTRIBUTING.md, on every pull request to master and every push
# to it. The ruleset of master requires the "checks" job to pass.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same pull request cancels the run still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the format check compares with the base branch
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-app.txt
      # pyright looks for the packages in .venv (pyproject.toml)
      - name: Install Python packages
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: ruff check
        run: .venv/bin/ruff check .
      # Only the files the pull request changed: a few committed files are
      # intentionally not ruff-formatted
      - name: ruff format (changed files)
        if: github.event_name == 'pull_request'
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR \
            "origin/${{ github.base_ref }}...HEAD" -- '*.py')
          if [ ${#files[@]} -gt 0 ]; then
            .venv/bin/ruff format --check "${files[@]}"
          fi
      - name: pyright (pavement_ui)
        run: .venv/bin/pyright
      - name: pyright (src, tests)
        run: .venv/bin/pyright src tests
      - name: lint-imports
        run: .venv/bin/lint-imports
      - name: pytest
        run: .venv/bin/pytest
