# beam_calculator — pavimento
# Unidades: coordenadas e dimensões em cm, cargas em kN/m², pé-direito em m.
# Modelo comentado, com todos os campos e valores aceitos: template.pavement.yaml,
# na pasta de exemplos.

# Pilares: centro (x, y) e seção (width × depth), em cm
pillars:
  - id: P1
    x: 4.0
    y: 1000.0
    width: 20
    depth: 25

  - id: P2
    x: 600.0
    y: 1000.0
    width: 20
    depth: 25

  - id: P3
    x: 1096.0
    y: 1000.0
    width: 20
    depth: 25

  - id: P4
    x: 4.0
    y: 400.0
    width: 20
    depth: 25

  - id: P5
    x: 597.0
    y: 400.0
    width: 20
    depth: 25

  - id: P6
    x: 4.0
    y: 0.0
    width: 20
    depth: 25

  - id: P7
    x: 600.0
    y: 0.0
    width: 20
    depth: 25

  - id: P8
    x: 1096.0
    y: 0.0
    width: 20
    depth: 25

# Vigas contínuas: pilares em ordem, largura (cm), alinhamento e parede
beams:
  - pillar_ids: [P1, P2, P3]
    reference_pillar_id: P1
    width: 19
    alignment: center
    wall:
      masonry_type: hollow concrete block
      nominal_thickness: 14
      coating_thickness: 1

  - pillar_ids: [P4, P5]
    reference_pillar_id: P4
    width: 14
    alignment: center
    wall:
      masonry_type: hollow concrete block
      nominal_thickness: 14
      coating_thickness: 1

  - pillar_ids: [P6, P7, P8]
    reference_pillar_id: P6
    width: 19
    alignment: center
    wall:
      masonry_type: hollow concrete block
      nominal_thickness: 14
      coating_thickness: 1

  - pillar_ids: [P6, P4, P1]
    reference_pillar_id: P1
    width: 19
    alignment: left
    wall:
      masonry_type: hollow concrete block
      nominal_thickness: 14
      coating_thickness: 1

  - pillar_ids: [P7, P5, P2]
    reference_pillar_id: P2
    width: 14
    alignment: center
    wall:
      masonry_type: hollow concrete block
      nominal_thickness: 14
      coating_thickness: 1

  - pillar_ids: [P8, P3]
    reference_pillar_id: P3
    width: 19
    alignment: right
    wall:
      masonry_type: hollow concrete block
      nominal_thickness: 14
      coating_thickness: 1

# Lajes: pilares de canto, uso (NBR 6120), carga permanente sem o peso próprio (kN/m²) e rebaixo (cm)
slabs:
  - corner_pillar_ids: [P1, P2, P4, P5]
    local: Bedrooms
    permanent_load: 0.0
    lowered: 0

  - corner_pillar_ids: [P2, P3, P7, P8]
    local: Bedrooms
    permanent_load: 0.0
    lowered: 0

  - corner_pillar_ids: [P4, P5, P6, P7]
    local: Bedrooms
    permanent_load: 0.0
    lowered: 5

# Configurações: materiais, detalhamento, agressividade e pé-direito
config:
  aggregate: granite
  max_aggregate_size: 2.5
  max_bar_types: 3
  max_layers: 3
  pavement_concrete: C50
  pavement_steel: CA50
  building_category: Residential buildings
  exposure_class: 1
  ceiling_height: 2.5
